name: Validate application
on:
  workflow_call:
    inputs:
      candidate:
        required: true
        type: string
  pull_request:
    branches: [staging, main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
permissions:
  contents: read
jobs:
  source:
    name: Release branch eligibility
    if: inputs.candidate != '' || (!github.event.pull_request.draft && (github.event.action != 'edited' || (github.event.pull_request.state == 'open' && github.event.changes.base.ref.from != '')))
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: inputs.candidate == ''
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the proposed merge
        id: classify
        if: inputs.candidate == ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/pages/docs-only.mjs "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Require a release or hotfix branch for main
        if: inputs.candidate == '' && github.base_ref == 'main' && !(github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')))
        run: |
          echo "::error::Target staging for feature work. Use a repository release/* or hotfix/* branch for main."
          exit 1
      - name: Check release contents against deployed staging
        if: inputs.candidate == '' && github.base_ref == 'main' && startsWith(github.head_ref, 'release/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          records="repos/$GITHUB_REPOSITORY"
          # The first workflow-only release installs the dispatcher on main.
          if ! gh api "$records/contents/.github/workflows/promote-pages.yml?ref=main" >/dev/null 2>lookup-error; then
            grep -Fq 'HTTP 404' lookup-error && exit 0
            cat lookup-error >&2
            exit 1
          fi
          staged=$(gh api -H 'Accept: application/vnd.github.raw+json' "$records/contents/manifest.json?ref=pages-state" --jq '.staging.sha')
          [[ "$staged" =~ ^[0-9a-f]{40}$ ]]
          node --input-type=module -e 'import { sameDeployableFiles } from "./scripts/pages/docs-only.mjs"; if (!sameDeployableFiles(process.argv[1], process.argv[2])) process.exit(1)' "$staged" "$RELEASE_SHA"
          node --input-type=module -e 'import { sameDeployableFiles } from "./scripts/pages/docs-only.mjs"; if (!sameDeployableFiles(process.argv[1], process.argv[2])) process.exit(1)' "$staged" "$GITHUB_SHA"
      - name: Accept source
        run: echo "PR source accepted."
      - name: Summarize source check
        if: always()
        run: |
          printf '### Source check\n\n- Result: **%s**\n- Checked eligibility for the target branch or accepted a pinned promotion revision.\n' '${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"
  release-sign-off:
    name: Record release sign-off
    needs: source
    if: inputs.candidate == '' && github.base_ref == 'main' && (startsWith(github.head_ref, 'release/') || (startsWith(github.head_ref, 'hotfix/') && needs.source.outputs.docs_only == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/github-script@v8
        env:
          DOCS_ONLY: ${{ needs.source.outputs.docs_only }}
        with:
          script: |
            const repo = context.repo
            const { data: candidate } = await github.rest.git.getCommit({ ...repo, commit_sha: context.sha })
            const tested = context.payload.pull_request
            const [{ data: pr }, { data: main }] = await Promise.all([
              github.rest.pulls.get({ ...repo, pull_number: tested.number }),
              github.rest.repos.getBranch({ ...repo, branch: 'main' })
            ])
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                (!pr.head.ref.startsWith('release/') && !(pr.head.ref.startsWith('hotfix/') && process.env.DOCS_ONLY === 'true')) || pr.head.sha !== tested.head.sha ||
                main.commit.sha !== tested.base.sha || candidate.parents[0]?.sha !== tested.base.sha ||
                candidate.parents[1]?.sha !== tested.head.sha) {
              throw new Error('Release head or main changed since validation')
            }
            core.info(`Release head=${pr.head.sha} base=${main.commit.sha} tested merge=${context.sha}`)
            const accepted = true
            await github.rest.repos.createCommitStatus({
              ...repo, sha: pr.head.sha, context: 'Production sign-off',
              state: accepted ? 'success' : 'failure',
              description: process.env.DOCS_ONLY === 'true' ? 'Documentation only' : 'Proposed merge matches deployed staging',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${context.runId}`
            })
  validate:
    name: Application tests
    needs: source
    if: needs.source.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check:db-types
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/browser
          if-no-files-found: ignore
          retention-days: 3
      - name: Summarize application validation
        if: always()
        env:
          REVISION: ${{ inputs.candidate || github.sha }}
        run: |
          printf '### Application validation\n\n- Result: **%s**\n- Revision: `%s`\n- Coverage: dependency audit, database types, architecture, lint, TypeScript, unit tests, build and Chromium browser tests.\n' '${{ job.status }}' "$REVISION" >> "$GITHUB_STEP_SUMMARY"
  database:
    name: Supabase migration and function tests
    needs: source
    if: needs.source.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-test-stack.mjs
      - name: Start disposable Supabase
        run: npx supabase start --workdir .test-stack
      - name: Apply migrations from an empty test database
        run: npx supabase db reset --local --workdir .test-stack
      - name: Run SQL authorization and lifecycle regressions
        run: npx supabase test db --workdir .test-stack
      - run: npx playwright install --with-deps chromium
      - name: Run real local-service browser acceptance
        run: |
          npx supabase functions serve --no-verify-jwt --workdir .test-stack > /tmp/lumiere-test-functions.log 2>&1 &
          FUNCTION_PID=$!
          trap 'kill "$FUNCTION_PID" 2>/dev/null || true' EXIT
          node scripts/wait-test-functions.mjs
          node tests/browser/local-supabase.mjs
      - name: Function failure diagnostics
        if: failure()
        run: node scripts/report-test-function-errors.mjs
      - name: Stop disposable Supabase
        if: always()
        run: npx supabase stop --no-backup --workdir .test-stack
      - name: Summarize database validation
        if: always()
        env:
          REVISION: ${{ inputs.candidate || github.sha }}
        run: |
          printf '### Disposable Supabase validation\n\n- Result: **%s**\n- Revision: `%s`\n- Coverage: migrations from an empty database, SQL regressions and browser tests against local Edge Functions.\n' '${{ job.status }}' "$REVISION" >> "$GITHUB_STEP_SUMMARY"
  preview:
    name: Prepare preview
    needs: [source, validate, database]
    if: >-
      always() && !cancelled() && needs.source.result == 'success' &&
      (needs.source.outputs.docs_only == 'true' || (needs.validate.result == 'success' && needs.database.result == 'success')) &&
      inputs.candidate == '' && github.event.pull_request.head.repo.full_name == github.repository &&
      (github.base_ref == 'staging' || (github.base_ref == 'main' && startsWith(github.head_ref, 'hotfix/')))
    uses: ./.github/workflows/pages-app-preview.yml
    with:
      candidate: ${{ github.sha }}
      base: /lumiere-app/preview/
      reusable_preview: true
      docs_only: ${{ needs.source.outputs.docs_only == 'true' }}

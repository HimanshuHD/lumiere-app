name: Build Lumiere for Pages

on:
  pull_request:
    branches: [staging, main]
    types: [opened, reopened, synchronize, ready_for_review, edited, converted_to_draft]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified app to the Lumiere Pages URL
        type: boolean
        default: false
      preview_sha:
        description: Optional reviewed preview commit SHA from this repository
        type: string
      live_ref:
        description: Published release tag to preserve when adding a preview
        type: string
        default: v0.1.0-pilot.1

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && (github.base_ref == 'staging' || (github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.preview_sha != '' && inputs.live_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the app under the Pages base
        run: |
          node --input-type=module <<'NODE'
          const { VITE_SUPABASE_URL: url, VITE_SUPABASE_ANON_KEY: key, PUBLISH } = process.env;
          const endpoint = new URL(url);
          if (endpoint.protocol !== 'https:' || endpoint.username || endpoint.password ||
              endpoint.pathname !== '/' || endpoint.search || endpoint.hash) {
            throw new Error('Set VITE_SUPABASE_URL to the HTTPS project origin.');
          }

          let isPublicKey = /^sb_publishable_[A-Za-z0-9_-]+$/.test(key);
          if (!isPublicKey && key.split('.').length === 3) {
            try {
              isPublicKey = JSON.parse(Buffer.from(key.split('.')[1], 'base64url')).role === 'anon';
            } catch { /* Invalid JWT. */ }
          }
          if (!isPublicKey) throw new Error('Set VITE_SUPABASE_ANON_KEY to a browser-safe key.');

          if (PUBLISH === 'true' &&
              (endpoint.origin === 'https://preview.example.invalid' || key === 'sb_publishable_ci_preview')) {
            throw new Error('Set both hosted Supabase Actions variables before publishing.');
          }
          NODE
          npm run build -- --mode pages
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://preview.example.invalid' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_ci_preview' }}
      - name: Check emitted entry assets
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';

          const html = readFileSync('dist/index.html', 'utf8');
          assert.equal(readFileSync('dist/auth/callback/index.html', 'utf8'), html);
          const assets = [...html.matchAll(/(?:src|href)="([^"]*\/assets\/[^"]+)"/g)]
            .map(([, url]) => url);
          assert(assets.some(url => url.endsWith('.js')), 'Expected an emitted JavaScript entry');
          for (const url of assets) {
            assert(url.startsWith('/lumiere-app/assets/'), 'Unexpected asset URL: ' + url);
            assert(existsSync('dist/' + url.slice('/lumiere-app/'.length)), 'Missing asset: ' + url);
          }
          NODE
      - name: Add reviewed preview to the Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && inputs.preview_sha != ''
        env:
          PREVIEW_SHA: ${{ inputs.preview_sha }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          [[ "$PREVIEW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Provide a full preview commit SHA.'; exit 1; }
          git fetch --no-tags origin "$PREVIEW_SHA"
          git worktree add --detach "$RUNNER_TEMP/preview-source" "$PREVIEW_SHA"
          (
            cd "$RUNNER_TEMP/preview-source"
            npm ci
            LUMIERE_PAGES_PREVIEW=true npm run build -- --mode pages
            cmp dist/index.html dist/auth/callback/index.html
            grep -q '/lumiere-app/preview/assets/' dist/index.html
          )
          test ! -e dist/preview
          mv "$RUNNER_TEMP/preview-source/dist" dist/preview

      - run: npx playwright install --with-deps chromium
      - name: Smoke test the Pages artifact in Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pages-smoke"
          ln -s "$PWD/dist" "$RUNNER_TEMP/pages-smoke/lumiere-app"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pages-smoke" &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:4173/lumiere-app/ -o /dev/null
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const origin = 'http://127.0.0.1:4173';
          const { existsSync } = await import('node:fs');
          const bases = ['/lumiere-app/'];
          if (existsSync('dist/preview/index.html')) bases.push('/lumiere-app/preview/');
          const browser = await chromium.launch();
          try {
            for (const base of bases) {
              const root = origin + base;
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              await page.route('**/*', route => {
                return new URL(route.request().url()).origin === origin
                  ? route.continue()
                  : route.abort();
              });

              assert.equal((await page.goto(root)).status(), 200);
              await page.getByPlaceholder('you@example.com').waitFor({ timeout: 10000 });

              assert.equal((await page.goto(root + 'auth/callback/')).status(), 200);
              assert.equal((await page.reload()).status(), 200);
              await page.getByRole('button', { name: 'Return to sign in' }).click({ timeout: 10000 });
              await page.getByPlaceholder('you@example.com').waitFor({ timeout: 10000 });
              assert.equal(new URL(page.url()).pathname, base);
              assert.deepEqual(errors, []);
              await page.close();
            }
          } finally {
            await browser.close();
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: lumiere-pages-preview
          path: dist
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
        with:
          path: dist

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

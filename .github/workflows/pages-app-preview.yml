name: Build Lumiere for Pages

on:
  pull_request:
    branches: [staging, main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_call:
    inputs:
      candidate:
        type: string
        required: true
      base:
        type: string
        required: true
      docs_only:
        type: boolean
        default: false
      reusable_preview:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  classify:
    if: inputs.candidate == '' && (github.base_ref == 'main' || github.event.pull_request.head.repo.full_name != github.repository) && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the proposed merge
        id: classify
        if: inputs.candidate == ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/pages/docs-only.mjs "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  build:
    name: Pages build and smoke test
    needs: classify
    if: >-
      always() && !cancelled() && !inputs.docs_only && (inputs.candidate != '' ||
      (needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' && (!github.event.pull_request.draft && ((github.base_ref == 'staging' && github.event.pull_request.head.repo.full_name != github.repository) || (github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')))))))
    runs-on: ubuntu-latest
    env:
      PAGES_BASE: ${{ inputs.base || '/lumiere-app/' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the app under the Pages base
        run: |
          node --input-type=module <<'NODE'
          const { VITE_SUPABASE_URL: url, VITE_SUPABASE_ANON_KEY: key, PUBLISH } = process.env;
          const endpoint = new URL(url);
          if (endpoint.protocol !== 'https:' || endpoint.username || endpoint.password ||
              endpoint.pathname !== '/' || endpoint.search || endpoint.hash) {
            throw new Error('Set VITE_SUPABASE_URL to the HTTPS project origin.');
          }

          let isPublicKey = /^sb_publishable_[A-Za-z0-9_-]+$/.test(key);
          if (!isPublicKey && key.split('.').length === 3) {
            try {
              isPublicKey = JSON.parse(Buffer.from(key.split('.')[1], 'base64url')).role === 'anon';
            } catch { /* Invalid JWT. */ }
          }
          if (!isPublicKey) throw new Error('Set VITE_SUPABASE_ANON_KEY to a browser-safe key.');

          if (PUBLISH === 'true' &&
              (endpoint.origin === 'https://preview.example.invalid' || key === 'sb_publishable_ci_preview')) {
            throw new Error('Set both hosted Supabase Actions variables before publishing.');
          }
          NODE
          npm run build -- --mode pages --base "$PAGES_BASE"
        env:
          PUBLISH: ${{ inputs.candidate != '' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://preview.example.invalid' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_ci_preview' }}
      - name: Check emitted entry assets
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';

          const html = readFileSync('dist/index.html', 'utf8');
          assert.equal(readFileSync('dist/auth/callback/index.html', 'utf8'), html);
          const assets = [...html.matchAll(/(?:src|href)="([^"]*\/assets\/[^"]+)"/g)]
            .map(([, url]) => url);
          assert(assets.some(url => url.endsWith('.js')), 'Expected an emitted JavaScript entry');
          for (const url of assets) {
            assert(url.startsWith(process.env.PAGES_BASE + 'assets/'), 'Unexpected asset URL: ' + url);
            assert(existsSync('dist/' + url.slice(process.env.PAGES_BASE.length)), 'Missing asset: ' + url);
          }
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the Pages artifact in Chromium
        run: |
          webroot="$RUNNER_TEMP/pages-smoke"
          mkdir -p "$(dirname "$webroot${PAGES_BASE%/}")"
          ln -s "$PWD/dist" "$webroot${PAGES_BASE%/}"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pages-smoke" &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:4173"$PAGES_BASE" -o /dev/null
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const origin = 'http://127.0.0.1:4173';
          const bases = [process.env.PAGES_BASE];
          const browser = await chromium.launch();
          try {
            for (const base of bases) {
              const root = origin + base;
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              await page.route('**/*', route => {
                return new URL(route.request().url()).origin === origin
                  ? route.continue()
                  : route.abort();
              });

              assert.equal((await page.goto(root)).status(), 200);
              await page.getByPlaceholder('you@example.com').waitFor({ timeout: 10000 });

              assert.equal((await page.goto(root + 'auth/callback/')).status(), 200);
              assert.equal((await page.reload()).status(), 200);
              await page.getByRole('button', { name: 'Return to sign in' }).click({ timeout: 10000 });
              await page.getByPlaceholder('you@example.com').waitFor({ timeout: 10000 });
              assert.equal(new URL(page.url()).pathname, base);
              assert.deepEqual(errors, []);
              await page.close();
            }
          } finally {
            await browser.close();
          }
          NODE
      - name: Identify reusable preview artifact
        if: inputs.reusable_preview
        id: preview
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          config=$(printf '%s\0%s' "$SUPABASE_URL" "$SUPABASE_KEY" | sha256sum | cut -d ' ' -f 1)
          echo "name=lumiere-preview-$GITHUB_SHA-$config" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.preview.outputs.name || 'lumiere-pages-preview' }}
          path: dist
          if-no-files-found: error
      - name: Summarize Pages build
        if: always()
        env:
          REVISION: ${{ inputs.candidate || github.sha }}
        run: |
          printf '### Pages build and browser smoke test\n\n- Result: **%s**\n- Revision: `%s`\n- Base path: `%s`\n- Coverage: emitted assets, sign-in screen and OAuth callback navigation.\n' '${{ job.status }}' "$REVISION" "$PAGES_BASE" >> "$GITHUB_STEP_SUMMARY"

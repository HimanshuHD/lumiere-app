name: Deploy hosted Supabase

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-functions.yml'

permissions:
  contents: read

concurrency:
  group: deploy-hosted-supabase
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.merged == true && (github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: supabase-hosted
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Check deployment configuration
        run: |
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::Set the hosted Supabase project reference in SUPABASE_PROJECT_REF."
            exit 1
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in the deployment environment."
            exit 1
          fi
          echo "Deploying commit $(git rev-parse HEAD)"
      - name: Check the release is still current
        run: |
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$(git rev-parse HEAD)" != "$main_sha" ]]; then
            echo "::error::Main has advanced. Reconcile pending backend changes with the current release before deploying."
            exit 1
          fi
      - name: Link the hosted project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply pending migrations
        run: supabase db push --linked --skip-vault --yes
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
